<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064E3B" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background with rounded corners -->
  <rect width="192" height="192" rx="42" fill="url(#bgGrad)" />

  <!-- Outer ornamental border ring -->
  <circle cx="96" cy="96" r="80" stroke="url(#goldGrad)" stroke-width="2" stroke-dasharray="6 4" opacity="0.4" />

  <!-- Sacred Mihrab Arch Silhouette -->
  <path d="M 52 144 L 52 86 C 52 62 72 44 96 32 C 120 44 140 62 140 86 L 140 144 Z"
        fill="none"
        stroke="url(#goldGrad)"
        stroke-width="5"
        stroke-linecap="round"
        stroke-linejoin="round"
        filter="url(#shadow)" />

  <!-- Inner delicate Arch -->
  <path d="M 64 144 L 64 92 C 64 74 80 58 96 48 C 112 58 128 74 128 92 L 128 144"
        fill="none"
        stroke="#FDE68A"
        stroke-width="2"
        opacity="0.6" />

  <!-- Crescent Moon (Hilal) -->
  <path d="M 102 72 C 92 72 84 80 84 90 C 84 100 92 108 102 108 C 105 108 107.5 107.2 110 106 C 101.5 112 89.5 109.5 86 100 C 83 91.5 88 81.5 96.5 78.5 C 98.5 78 100.5 78 102 78.5 Z"
        fill="url(#goldGrad)"
        filter="url(#shadow)" />

  <!-- Five-pointed Star (Noor) -->
  <polygon points="110,68 113,75 120,75 114.5,80 116.5,87 110,82.5 103.5,87 105.5,80 100,75 107,75"
           fill="#FEF08A"
           filter="url(#shadow)" />

  <!-- Baseline Shelf -->
  <line x1="42" y1="144" x2="150" y2="144" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round" />

  <!-- Minaret Tip Dome -->
  <circle cx="96" cy="28" r="4.5" fill="url(#goldGrad)" />
</svg>
